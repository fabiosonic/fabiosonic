name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: plataforma_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: demo
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-somente-teste-segredo-com-mais-de-32-caracteres
      DATABASE_URL: postgresql://app:app@localhost:5432/plataforma_dev?schema=public
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/plataforma_test?schema=public
      EMAIL_TRANSPORT: dev
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Criar banco de teste
        run: PGPASSWORD=app psql -h localhost -U app -d plataforma_dev -c "CREATE DATABASE plataforma_test"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
