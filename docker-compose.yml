services:
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./dados:/app/dados", "./credenciais:/app/credenciais:ro"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "mo_obrigacoes", "worker"]
    volumes: ["./dados:/app/dados", "./credenciais:/app/credenciais:ro"]
    restart: unless-stopped
