services:
  comercial:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3333:3333"
    volumes:
      - dados:/dados

  # IA local opcional (reserva final do rodízio, sem limites e sem enviar dados para fora).
  # Ative com: docker compose --profile ia-local up -d
  # Depois: docker compose exec ollama ollama pull qwen2.5:7b-instruct
  # E no .env: OLLAMA_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ia-local"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  dados:
  ollama:
