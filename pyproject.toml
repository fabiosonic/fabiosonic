[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mo-openfinance"
version = "0.1.0"
description = "Extrato via Open Finance (TecnoSpeed ou Pluggy) → banco local idempotente → lançamentos para o Domínio"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mo-openfinance = "mo_openfinance.__main__:main"

[tool.setuptools]
packages = ["mo_openfinance"]
