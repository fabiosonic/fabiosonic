[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-contabil"
version = "0.1.0"
description = "Importação e auditoria automática de documentos fiscais para escritórios de contabilidade"
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7", "openpyxl>=3.1"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
portal-contabil = "portal_contabil.cli:main"

[tool.setuptools.packages.find]
include = ["portal_contabil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
