{% extends "base.html" %}{% block titulo %}Equipe{% endblock %}
{% block conteudo %}
<h1>Equipe / responsáveis</h1>
<div class="painel"><form method="post" action="/responsaveis" class="filtros">
<label>Nome<input name="nome" required></label><label>E-mail<input type="email" name="email"></label>
<label>Departamento<select name="departamento">{% for k, v in DEPARTAMENTOS.items() if k != 'CLIENTE' %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></label>
<button>Adicionar</button></form></div>
<div class="painel"><table><tr><th>Nome</th><th>E-mail</th><th>Departamento</th><th>Situação</th><th></th></tr>
{% for r in responsaveis %}<tr><td>{{ r.nome }}</td><td>{{ r.email }}</td><td>{{ DEPARTAMENTOS.get(r.departamento) }}</td><td>{{ 'Ativo' if r.ativo else 'Inativo' }}</td>
<td><form class="inline" method="post" action="/responsaveis/{{ r.id }}/alternar"><button class="peq sec">{{ 'Desativar' if r.ativo else 'Ativar' }}</button></form></td></tr>{% endfor %}</table></div>
{% endblock %}
