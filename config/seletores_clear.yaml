# =============================================================================
# Mapa da tela do Home Broker da Clear (seletores CSS/Playwright)
# =============================================================================
# O layout do Home Broker muda com frequência e só é visível logado, por isso
# os seletores NÃO vêm prontos: você os captura uma vez com
#
#     python -m swingbot calibrar
#
# (abre o navegador + Playwright Inspector; clique em "Pick locator", aponte o
# elemento e cole o seletor aqui). Prefira seletores estáveis:
#   - texto visível:      text=Comprar            role=button[name="Enviar"]
#   - atributos:          input[name="quantity"]  [data-testid="order-price"]
#   - evite classes geradas automaticamente (ex.: .sc-1x2y3z).
#
# Valor "PREENCHER" = obrigatório e ainda não calibrado (o modo real se recusa
# a rodar). Valor "" = opcional / não usado.
# Depois de calibrar, teste SEM enviar ordens:  python -m swingbot ensaio PETR4
# =============================================================================

# RASCUNHO baseado na tela do Home Broker novo (trader.clear.com.br/home-broker/new/).
# Itens com texto visível já preenchidos; os demais vêm do comando 'python -m swingbot mapear'.
validado: false                  # só vira true depois do 'ensaio' confirmado por você

urls:
  site: "https://www.clear.com.br"
  homebroker: "https://trader.clear.com.br/home-broker/new/"

navegacao:
  link_login: ""                 # botão "Entrar" do site (opcional)
  link_homebroker: ""            # não necessário: usa urls.homebroker
  indicador_logado: "text=Resumo da conta"   # painel que só existe logado
  modo_swing: "button:has-text('Swing Trade')"   # alternância Swing Trade | DT no topo
  menu_custodia: ""              # painel "Posição Swing Trade" já fica na tela
  menu_ordens: ""                # painel "Ordens Swing Trade" já fica na tela

custodia:                        # tabela de posições
  linha: PREENCHER               # seletor de cada linha da tabela
  ativo: PREENCHER               # relativo à linha
  quantidade: PREENCHER          # relativo à linha
  preco_medio: ""                # a tabela "Posição Swing Trade" não mostra preço médio
  preco_atual: ""                # relativo à linha (opcional: cotação usada pelo monitor)

boleta:
  abrir_compra: "text='Compra'"  # aba da boleta (Compra | Venda | Rápida)
  abrir_venda: "text='Venda'"
  # "Tipo de ordem" é uma LISTA: use dois cliques (abrir a lista, escolher a opção), ex.:
  #   aba_limitada: ["<seletor da lista>", "text='Limitada'"]
  aba_limitada: PREENCHER
  aba_stop: PREENCHER
  campo_ativo: PREENCHER
  campo_quantidade: PREENCHER
  campo_preco: PREENCHER         # preço limite
  campo_disparo: PREENCHER       # preço de disparo do stop
  campo_assinatura: ""           # assinatura eletrônica (se exigida a cada ordem)
  botao_enviar: "button:text-matches('^(Comprar|Vender)', 'i')"   # botão verde "Comprar 2,68"
  confirmacao: PREENCHER         # mensagem/elemento de ordem enviada com sucesso
  erro: ""                       # mensagem de erro/rejeição (recomendado)
  fechar: ""                     # fechar a boleta após enviar (se necessário)
  # --- OCO / stop duplo (opcional): stop loss + take profit juntos na Clear
  aba_oco: ""
  campo_gain_disparo: ""
  campo_gain_preco: ""
  campo_loss_disparo: ""
  campo_loss_preco: ""

ordens:                          # tabela de ordens do dia
  linha: PREENCHER
  ativo: PREENCHER               # relativo à linha
  tipo: PREENCHER                # relativo à linha (ex.: "Stop", "Limitada")
  lado: PREENCHER                # relativo à linha (ex.: "Compra", "Venda")
  status: PREENCHER              # relativo à linha (ex.: "Aberta", "Executada")
  botao_cancelar: PREENCHER      # relativo à linha
  confirmar_cancelamento: ""     # botão de confirmação do cancelamento (se houver)
  textos_stop: ["Stop", "OCO"]
  textos_venda: ["Venda", "V"]
  textos_aberta: ["Aberta", "Pendente", "Parcial", "Nova"]
