- id: TABELA_IRRF_MENSAL
  titulo: Tabela progressiva mensal do IRPF/IRRF e redutor (Lei 15.270/2025)
  area: dp
  status: PENDENTE
  fonte_url_sugerida: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15270.htm
  vigencia: {inicio: "2026-01-01"}
  parametros:
    # PROPOSTA (fonte secundária: valorfinal.com.br, portaltributario.com.br, caltrab.com) — conferir na lei
    faixas:
      - {ate: "2428.80", aliquota: "0", deduzir: "0"}
      - {ate: "2826.65", aliquota: "0.075", deduzir: "182.16"}
      - {ate: "3751.05", aliquota: "0.15", deduzir: "394.16"}
      - {ate: "4664.68", aliquota: "0.225", deduzir: "675.49"}
      - {ate: null, aliquota: "0.275", deduzir: "908.73"}
    deducao_por_dependente: "189.59"
    # redução: rendimentos tributáveis até 5.000,00 zeram o imposto (redução de até R$ 312,89);
    # de 5.000,01 a 7.350,00: redução = 978,62 − 0,133145 × rendimentos tributáveis.
    # "base: rendimento" = medido sobre os RENDIMENTOS TRIBUTÁVEIS (antes das deduções) — CONFERIR no texto da lei.
    redutor: {base: rendimento, zera_ate: "5000.00", faixa_ate: "7350.00", constante: "978.62", coeficiente: "0.133145"}
